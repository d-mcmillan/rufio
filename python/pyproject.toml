[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rufio"
dynamic = ["version"]
description = "Python SDK for Rufio — substrate for distributed agent cognition"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 inline SPDX expression — avoids out-of-tree license-path
# resolution that historically confused hatchling's package discovery.
license = "Apache-2.0"
authors = [{ name = "d-mcmillan", email = "damon.f.mcmillan@gmail.com" }]
keywords = ["rufio", "agent", "cognition", "substrate", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "sseclient-py>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/d-mcmillan/rufio"
Repository = "https://github.com/d-mcmillan/rufio"
Issues = "https://github.com/d-mcmillan/rufio/issues"

[tool.hatch.version]
path = "rufio/_version.py"

# Explicit wheel target. `packages = ["rufio"]` + an explicit
# `include` is belt-and-suspenders with the force-include directive
# below — the combination guarantees the rufio package files land
# in the wheel even when hatchling's default file-set walker behaves
# inconsistently across layouts.
[tool.hatch.build.targets.wheel]
packages = ["rufio"]
include = [
    "rufio/**/*.py",
    "README.md",
]
[tool.hatch.build.targets.wheel.force-include]
"rufio" = "rufio"

[tool.hatch.build.targets.sdist]
include = [
    "rufio/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length is enforced by format, ignore lint-side too

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
