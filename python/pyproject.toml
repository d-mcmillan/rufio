[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rufio"
dynamic = ["version"]
description = "Python SDK for Rufio — substrate for distributed agent cognition"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 inline SPDX expression. Avoids the v1.0.5 launch-blocker
# bug where `license = { file = "../LICENSE" }` (out-of-tree path)
# caused hatchling's source-file discovery to misidentify the
# package root and produce an empty wheel. Inline string also
# eliminates the need to vendor LICENSE into python/.
license = "Apache-2.0"
authors = [{ name = "d-mcmillan", email = "damon.f.mcmillan@gmail.com" }]
keywords = ["rufio", "agent", "cognition", "substrate", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "sseclient-py>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/d-mcmillan/rufio"
Repository = "https://github.com/d-mcmillan/rufio"
Issues = "https://github.com/d-mcmillan/rufio/issues"

[tool.hatch.version]
path = "rufio/_version.py"

# Explicit build configuration — the v1.0.5 launch-blocker root
# cause was hatchling building an empty wheel when given only
# `[tool.hatch.build.targets.wheel] packages = ["rufio"]` plus a
# `license = { file = "../LICENSE" }` referencing an out-of-tree
# path. The combination confused hatchling's file-set discovery
# (it walked up to the repo root to resolve ../LICENSE and lost
# track of where the package root was). The fix has two parts:
#
#   1. Inline `license = "MIT"` (PEP 639) — no out-of-tree path.
#   2. Explicit `include` directive on the wheel target that
#      names the rufio package files. `packages = ["rufio"]`
#      alone is supposed to be sufficient but proved not to be
#      with the v1.0.5 layout.
#
# Sdist target gets a parallel include so source tarballs are
# also non-empty if someone runs `python -m build --sdist`.
[tool.hatch.build.targets.wheel]
packages = ["rufio"]
include = [
    "rufio/**/*.py",
    "README.md",
]
# Hatchling's default file-set walker missed rufio/ entirely in
# the v1.0.5 layout (likely because of the historical
# license={file="../LICENSE"} pulling root resolution upward, but
# the bug persists even after switching to inline license). The
# force-include directive bypasses the walker and maps src→dest
# directly. Belt-and-suspenders with `packages` above.
[tool.hatch.build.targets.wheel.force-include]
"rufio" = "rufio"

[tool.hatch.build.targets.sdist]
include = [
    "rufio/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length is enforced by format, ignore lint-side too

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
